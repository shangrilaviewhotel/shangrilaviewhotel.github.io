name: Keep Hotel Concierge on Every Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-concierge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject shared concierge into HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          marker = '<script src="concierge.js" defer></script>'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              lower = text.lower()
              if '</head>' in lower:
                  pos = lower.index('</head>')
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
              elif '</body>' in lower:
                  pos = lower.index('</body>')
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
              else:
                  text += '\n' + marker + '\n'
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))
          print('Injected concierge into:', ', '.join(changed) if changed else 'no files needed changes')
          PY

      - name: Ensure live admin booking synchronisation is loaded
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('admin.html')
          marker = '<script src="admin-booking-sync.js" defer></script>'
          if path.exists():
              text = path.read_text(encoding='utf-8')
              if marker not in text:
                  lower = text.lower()
                  pos = lower.index('</head>') if '</head>' in lower else len(text)
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
                  path.write_text(text, encoding='utf-8')
                  print('Injected live admin booking synchronisation.')
          PY

      - name: Ensure room video booking script is loaded on booking page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('booking.html')
          marker = '<script src="booking-room-videos.js" defer></script>'
          if not path.exists():
              raise SystemExit('booking.html was not found')
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              lower = text.lower()
              if '</head>' in lower:
                  pos = lower.index('</head>')
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
              elif '</body>' in lower:
                  pos = lower.index('</body>')
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
              else:
                  text += '\n' + marker + '\n'
              path.write_text(text, encoding='utf-8')
              print('Injected booking-room-videos.js into booking.html')
          else:
              print('booking-room-videos.js is already loaded by booking.html')
          PY

      - name: Ensure floating Book Now shortcut is loaded on booking page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('booking.html')
          marker = '<script src="booking-floating.js" defer></script>'
          if not path.exists():
              raise SystemExit('booking.html was not found')
          text = path.read_text(encoding='utf-8')
          if marker not in text:
              lower = text.lower()
              if '</head>' in lower:
                  pos = lower.index('</head>')
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
              elif '</body>' in lower:
                  pos = lower.index('</body>')
                  text = text[:pos] + '  ' + marker + '\n' + text[pos:]
              else:
                  text += '\n' + marker + '\n'
              path.write_text(text, encoding='utf-8')
              print('Injected booking-floating.js into booking.html')
          else:
              print('booking-floating.js is already loaded by booking.html')
          PY

      - name: Commit generated page changes
        run: |
          if git diff --quiet; then
            echo 'No generated page changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Load live booking synchronisation on admin page [skip ci]'
          git push
