<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login — Shangri-La View Hotel</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">


<style>

:root{
--navy:#142848;
--gold:#D4AF37;
--crimson:#C41E3A;
}


*{
box-sizing:border-box;
}


body{

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

font-family:'Montserrat',sans-serif;

background:
linear-gradient(
135deg,
#0b1935,
#142848,
#0c172e
);

color:white;

}



.container{

width:380px;

padding:40px;

background:
rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:20px;

box-shadow:
0 20px 60px rgba(0,0,0,.5);

border:1px solid rgba(255,255,255,.15);

}



.logo{

width:70px;
height:70px;

border-radius:50%;

border:2px solid var(--gold);

display:flex;
align-items:center;
justify-content:center;

margin:auto;

font-family:'Playfair Display',serif;

font-size:24px;

color:var(--gold);

}



h1{

font-family:'Playfair Display',serif;

text-align:center;

margin:20px 0 5px;

}


.subtitle{

text-align:center;

font-size:13px;

opacity:.7;

margin-bottom:30px;

}



input{

width:100%;

padding:14px;

margin-bottom:15px;

border-radius:10px;

border:none;

font-size:14px;

outline:none;

}



button{

width:100%;

padding:14px;

border:none;

border-radius:30px;

cursor:pointer;

font-weight:700;

margin-top:10px;

}



.login{

background:var(--gold);

color:#111;

}



.google{

background:white;

color:#111;

}



.forgot{

text-align:right;

font-size:12px;

margin-top:-8px;

cursor:pointer;

color:#e8ce7a;

}



.status{

text-align:center;

margin-top:15px;

font-size:13px;

color:#ffdddd;

}



.loading{

opacity:.6;

pointer-events:none;

}


.footer{

text-align:center;

font-size:11px;

opacity:.6;

margin-top:25px;

}


</style>

</head>



<body>



<div class="container">


<div class="logo">
SL
</div>


<h1>
Admin Portal
</h1>


<div class="subtitle">
Shangri-La View Hotel Management System
</div>



<input 
id="email"
type="email"
placeholder="Admin Email"
>


<input
id="password"
type="password"
placeholder="Password"
>



<div class="forgot" onclick="forgotPassword()">
Forgot password?
</div>



<button 
class="login"
onclick="login()"
id="loginBtn">

Login

</button>



<button 
class="google"
onclick="googleLogin()"
id="googleBtn">

Continue with Google

</button>



<div id="status" class="status"></div>



<div class="footer">

Restricted administrator access only

</div>


</div>




<script>


const firebaseConfig = {


apiKey: "AIzaSyDhwIAmuZrY5Xqo6Ql7LDKxrPiklpG5GTE",

authDomain: "shangrila-booking.firebaseapp.com",

projectId: "shangrila-booking",

storageBucket: "shangrila-booking.appspot.com",

messagingSenderId: "981170210173",

appId: "1:981170210173:web:4d74cb3f6109fe1c0a3814"

};



firebase.initializeApp(firebaseConfig);


const auth=firebase.auth();




// CHANGE THESE EMAILS

const ADMIN_EMAILS=[

"Shangrilaviewhotel@gmail.com",

"akeem.fatai15@gmail.com"

];




function showMessage(msg){

document.getElementById("status").innerHTML=msg;

}




function checkAdmin(user){


if(
ADMIN_EMAILS.includes(user.email)
){

window.location.href="admin.html";

}

else{


auth.signOut();

showMessage(
"Access denied. Admin account required."
);


}


}





function login(){


const email=
document.getElementById("email").value;


const password=
document.getElementById("password").value;



if(!email||!password){

showMessage(
"Enter email and password"
);

return;

}



document.body.classList.add("loading");



auth
.signInWithEmailAndPassword(email,password)

.then(result=>{


checkAdmin(result.user);


})

.catch(error=>{


showMessage(error.message);


document.body.classList.remove("loading");


});


}




function googleLogin(){



const provider=
new firebase.auth.GoogleAuthProvider();



auth
.signInWithPopup(provider)

.then(result=>{


checkAdmin(result.user);


})

.catch(error=>{


showMessage(error.message);


});


}





function forgotPassword(){


const email=
document.getElementById("email").value;



if(!email){

showMessage(
"Enter your email first"
);

return;

}



auth.sendPasswordResetEmail(email)

.then(()=>{

showMessage(
"Password reset email sent"
);


})

.catch(error=>{

showMessage(error.message);

});


}





// If already logged in

auth.onAuthStateChanged(user=>{


if(user && ADMIN_EMAILS.includes(user.email)){


window.location.href="admin.html";


}


});



</script>


</body>

</html>
