<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Shangri-La View Hotel</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;
display:flex;
align-items:center;
justify-content:center;

font-family:'Montserrat',sans-serif;

background:
linear-gradient(
rgba(5,10,30,.85),
rgba(5,10,30,.95)
),
url("hotelEN.jpg");

background-size:cover;
background-position:center;

color:white;

}


.login-box{

width:380px;

padding:45px;

background:
rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:25px;

border:1px solid rgba(212,175,55,.4);

box-shadow:
0 30px 80px rgba(0,0,0,.6),
0 0 40px rgba(212,175,55,.2);

text-align:center;

}



.logo{

width:80px;
height:80px;

border-radius:50%;

border:3px solid #D4AF37;

margin-bottom:20px;

}



h1{

font-family:'Playfair Display',serif;

font-size:32px;

background:
linear-gradient(
90deg,
#D4AF37,
white,
#C41E3A
);

-webkit-background-clip:text;

color:transparent;

margin-bottom:10px;

}


.subtitle{

font-size:13px;

color:#ddd;

margin-bottom:30px;

text-transform:uppercase;

letter-spacing:2px;

}



.input-box{

position:relative;

margin-bottom:20px;

}



input{

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:10px;

font-size:15px;

background:white;

}



.password-toggle{

position:absolute;

right:15px;

top:15px;

cursor:pointer;

color:#333;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:30px;

cursor:pointer;

font-weight:700;

text-transform:uppercase;

letter-spacing:1px;

background:
linear-gradient(
135deg,
#D4AF37,
#b8860b
);

color:#000;

transition:.3s;

}


button:hover{

transform:translateY(-3px);

box-shadow:
0 15px 40px rgba(212,175,55,.5);

}



#message{

margin-top:20px;

font-size:14px;

color:#ffcccc;

}



.footer{

margin-top:25px;

font-size:12px;

color:#aaa;

}



</style>


</head>


<body>


<div class="login-box">


<img src="hlogo.png" class="logo">


<h1>Admin Portal</h1>

<p class="subtitle">
Shangri-La View Hotel
</p>


<div class="input-box">

<input 
type="email"
id="email"
placeholder="Admin Email"
>


</div>



<div class="input-box">

<input 
type="password"
id="password"
placeholder="Password"
>


<span 
class="password-toggle"
onclick="togglePassword()">
👁
</span>


</div>



<button onclick="login()">

Login

</button>


<p id="message"></p>



<div class="footer">

Authorized Personnel Only

</div>


</div>



<script>


// FIREBASE CONFIG

const firebaseConfig = {

apiKey: "AIzaSyCvcC5ysf6JpJlwmUJBEvXZBl-NSiVD7pw",

authDomain:
"shangrilaviewhotel-d0b66.firebaseapp.com",

projectId:
"shangrilaviewhotel-d0b66",

storageBucket:
"shangrilaviewhotel-d0b66.firebasestorage.app",

messagingSenderId:
"991707133444",

appId:
"1:991707133444:web:54b3bd19b63775e90ce751",

measurementId:
"G-1XQ7L6LM2F"

};



firebase.initializeApp(firebaseConfig);


const auth=firebase.auth();



const ADMIN_EMAIL =
"akeem.fatai15@gmail.com";



// LOGIN FUNCTION

function login(){


const email =
document.getElementById("email").value.trim();


const password =
document.getElementById("password").value;



const message =
document.getElementById("message");



if(!email || !password){

message.innerHTML =
"Enter email and password";

return;

}



message.innerHTML="Checking access...";



auth.signInWithEmailAndPassword(email,password)

.then((userCredential)=>{


const user=userCredential.user;



if(user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){


message.style.color="#D4AF37";

message.innerHTML=
"Access granted...";


setTimeout(()=>{

window.location.href="admin.html";

},1000);



}

else{


auth.signOut();


message.innerHTML=
"Unauthorized account";


}



})


.catch(error=>{


message.innerHTML=
error.message;


});



}




// SHOW PASSWORD

function togglePassword(){


const password =
document.getElementById("password");


if(password.type==="password"){

password.type="text";

}

else{

password.type="password";

}


}




// CHECK EXISTING SESSION


auth.onAuthStateChanged((user)=>{


if(user && user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){


window.location.href="admin.html";


}



});



</script>


</body>

</html>
